services:
  mysql:
    build: ./database
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  django:
    build: ./backend/django_app
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_ENGINE: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
  fastapi:
    build: ./backend/fastapi_service
    env_file: .env
    environment:
      DJANGO_INTERNAL_URL: http://django:8000
    depends_on:
      - django
    ports:
      - "8001:8001"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DJANGO_URL: ${VITE_DJANGO_URL:-http://localhost:8000}
        VITE_PAYMENT_URL: ${VITE_PAYMENT_URL:-http://localhost:8001}
    depends_on:
      - django
      - fastapi
    ports:
      - "5173:80"
volumes:
  mysql_data: